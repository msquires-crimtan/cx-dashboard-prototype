<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Access — CX Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html,body{height:100%;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  #gate{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    background: radial-gradient(ellipse at 70% 50%, #FF5A1A 0%, #C8001E 45%, #7A0020 100%);
  }
  #gate::before{
    content:'';position:absolute;inset:0;
    background: radial-gradient(ellipse at 15% 40%, rgba(120,0,30,0.7) 0%, transparent 60%);
    pointer-events:none;
  }
  .gate-logo{display:flex;align-items:center;justify-content:center;margin-bottom:28px;position:relative;z-index:1;}
  .gate-logo img{height:28px;width:auto;}
  .gate-card{
    width:100%;max-width:400px;position:relative;z-index:1;
    background:rgba(60,5,25,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:0.5px solid rgba(255,255,255,0.12);border-radius:16px;
    padding:32px 28px;display:flex;flex-direction:column;gap:18px;
  }
  .gate-card h1{font-size:18px;font-weight:600;color:#fff;text-align:center;}
  .gate-card .gate-sub{font-size:13px;color:rgba(255,255,255,0.55);text-align:center;margin-top:-8px;line-height:1.5;}
  label{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.5);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;}
  input[type="email"],input[type="password"],input[type="text"]{
    width:100%;padding:10px 13px;
    border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;
    background:rgba(255,255,255,0.08);color:#fff;
    font-family:'DM Sans',sans-serif;font-size:14px;outline:none;
    transition:border-color .15s,background .15s;
  }
  input:focus{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.12);}
  input::placeholder{color:rgba(255,255,255,0.3);}
  .field{display:flex;flex-direction:column;gap:0;}
  .err{font-size:12.5px;color:#FF8A8A;display:none;}
  .btn-primary{
    width:100%;padding:11px;
    background:rgba(255,255,255,0.15);color:#fff;
    font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
    border:0.5px solid rgba(255,255,255,0.25);border-radius:8px;
    cursor:pointer;transition:background .15s,opacity .15s;
  }
  .btn-primary:hover{background:rgba(255,255,255,0.22);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  #mfa-qr{display:none;width:160px;height:160px;margin:4px auto;border-radius:8px;background:#fff;padding:8px;}
  #mfa-secret{display:none;font-size:11px;color:rgba(255,255,255,0.45);text-align:center;font-family:monospace;word-break:break-all;margin-top:-8px;}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-logo"><img src="/crimtan-logo-white.png" alt="Crimtan"></div>
  <div class="gate-card">
    <h1>Client Access</h1>
    <div class="gate-sub">Sign in to view your live dashboard.</div>

    <div id="step-password" style="display:flex;flex-direction:column;gap:18px;">
      <div class="field"><label>Email</label><input type="email" id="email" autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="err" id="pw-err"></div>
      <button class="btn-primary" id="pw-submit">Sign in</button>
    </div>

    <div id="step-mfa" style="display:none;flex-direction:column;gap:18px;">
      <div class="gate-sub" id="mfa-instructions">Enter the 6-digit code from your authenticator app.</div>
      <img id="mfa-qr" alt="Scan with an authenticator app">
      <div id="mfa-secret"></div>
      <div class="field"><label>Verification code</label><input type="text" id="mfa-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
      <div class="err" id="mfa-err"></div>
      <button class="btn-primary" id="mfa-submit">Verify</button>
    </div>
  </div>
</div>
<script src="/client-auth.js"></script>
</body>
</html>
